name: Update article data

# 週次で scp-jp をクロールし、新規記事のタイトルと評価・文字数を増分取得する。
# 差分があれば main へ自動コミットし、Pages デプロイを起動する。
on:
  schedule:
    - cron: '0 18 * * 0'   # 日曜 18:00 UTC = 月曜 3:00 JST
  workflow_dispatch:
    inputs:
      max_detail_pages:
        description: '詳細（評価・文字数）を取得する最大ページ数。バックログ消化時は 2000 程度に上げる'
        required: false
        default: '500'

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch titles (all branches)
        run: node scripts/fetch-titles.mjs

      - name: Fetch details (ratings + char counts, incremental)
        run: node scripts/fetch-details.mjs --max "${{ github.event.inputs.max_detail_pages || '500' }}"

      - name: Commit and push if changed
        id: commit
        run: |
          git add src/data/titles.json src/data/char_counts.json src/data/ratings.json scripts/detail-misses.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "差分なし — コミットしません"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: 記事データ自動更新 ($(date -u +%Y-%m-%d))"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN による push は push トリガーの workflow を起動しない（再帰防止仕様）ため、
      # デプロイを明示的に dispatch する
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "${{ github.repository }}"
