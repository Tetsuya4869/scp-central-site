<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ホーム · SCP Reading Atlas</title>
    <meta name="description" content="16支部のSCP記事を横断して探し、読了・メモ・読むキューを一つの流れで管理する読書アトラス。" />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/scp-central-site/icon.svg" />
    <link rel="manifest" href="/scp-central-site/manifest.json" />
    <meta id="app-theme-color" name="theme-color" content="#191713" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const appBase = new URL('./', document.baseURI)
          navigator.serviceWorker.register(new URL('sw.js', appBase), { scope: appBase.pathname })
        })
      }
    </script>
  </body>
</html>
