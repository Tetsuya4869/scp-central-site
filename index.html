<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SCP 読了チェックリスト</title>
    <meta name="description" content="SCPの読了状況と進捗を確認し、お気に入りの記事を一覧で管理するチェックリスト。" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/scp-central-site/icon.svg" />
    <link rel="manifest" href="/scp-central-site/manifest.json" />
    <meta id="app-theme-color" name="theme-color" content="#191713" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const appBase = new URL('./', document.baseURI)
          navigator.serviceWorker.register(new URL('sw.js', appBase), { scope: appBase.pathname })
        })
      }
    </script>
  </body>
</html>
